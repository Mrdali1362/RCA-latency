<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCA Audio Sync prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #111111; }
  body { display: flex; align-items: center; justify-content: center; }
  * { box-sizing: border-box; }
  .screen {
    width: 390px; height: 844px; position: relative; overflow: hidden;
    background: linear-gradient(180deg, #4a4a4a 0%, #1e1e1e 100%);
    color: #ffffff; font-family: 'Roboto Condensed', 'Arial Narrow', Arial, sans-serif;
    display: flex; flex-direction: column; padding-bottom: 58px; user-select: none; -webkit-user-select: none;
  }
  @media (max-width: 420px) { body { display: block; } .screen { width: 100vw; height: 100vh; height: 100dvh; } }
  button { font-family: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
  button[aria-disabled="true"] { cursor: default; }
  button:focus-visible, [role="slider"]:focus-visible { outline: 2px solid #E8A33A; outline-offset: 2px; }
  header { height: 100px; position: relative; flex-shrink: 0; }
  .back { position: absolute; left: 3px; top: 46px; width: 44px; height: 44px; background: none; border: 0; display: flex; align-items: center; justify-content: center; }
  h1 { position: absolute; left: 0; right: 0; top: 58px; margin: 0; text-align: center; font-size: 17px; font-weight: 700; letter-spacing: 0.2px; }
  .intro { padding: 0 24px; }
  .intro p { margin: 12px 0 0; font-size: 15px; line-height: 23.5px; color: #e8e8e8; }
  .play { margin-top: 24px; width: 100%; height: 48px; background: transparent; border: 1px solid #626262; font-size: 16px; font-weight: 700; }
  .readout { margin-top: 68px; display: flex; flex-direction: column; align-items: center; }
  .value { font-size: 76px; font-weight: 700; line-height: 76px; }
  .unit { font-size: 14px; line-height: 18px; color: #d0d0d0; }
  .ruler { margin-top: 17px; position: relative; width: 100%; height: 57px; overflow: hidden; touch-action: none; cursor: grab;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 80px, #000 calc(100% - 80px), transparent 100%);
            mask-image: linear-gradient(to right, transparent 0, #000 80px, #000 calc(100% - 80px), transparent 100%); }
  .ruler.dragging { cursor: grabbing; }
  .tick { position: absolute; width: 2px; pointer-events: none; }
  .label { position: absolute; top: 39px; width: 24px; text-align: center; font-size: 13px; line-height: 16px; pointer-events: none; }
  .marker { position: absolute; top: 0; width: 2px; height: 30px; background: #E8A33A; pointer-events: none; }
  .steppers { margin-top: 23px; padding: 0 24px; display: flex; justify-content: space-between; }
  .step { width: 48px; height: 48px; background: transparent; border: 1px solid #c4c4c4; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
  .spacer { flex-grow: 1; }
  .toast { position: absolute; left: 24px; right: 24px; bottom: 120px; height: 20px; text-align: center; font-size: 14px; font-weight: 700; letter-spacing: 0.3px; }
  .footer { padding: 0 24px; }
  .save { width: 100%; height: 48px; background: #ffffff; color: #111111; border: 0; font-size: 16px; font-weight: 700; }
</style>
</head>
<body>
<main class="screen">
  <header>
    <button class="back" aria-label="Back"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="bevel"><path d="M10.5 3 5.5 8l5 5"/></svg></button>
    <h1>RCA AUDIO SYNC</h1>
  </header>
  <div class="intro">
    <p>Play the sample and listen to all speakers. If the RCA speaker plays ahead of the others, add delay until they play together.</p>
    <button class="play" id="play" aria-pressed="false">PLAY SAMPLE</button>
  </div>
  <div class="readout" aria-hidden="true">
    <div class="value" id="value">0</div>
    <div class="unit">milliseconds</div>
  </div>
  <div class="ruler" id="ruler" role="slider" tabindex="0" aria-label="Delay" aria-valuemin="0" aria-valuemax="75" aria-valuenow="0" aria-valuetext="0 milliseconds"></div>
  <div class="steppers">
    <button class="step" id="minus" aria-label="Decrease delay"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="square"><path d="M1 8h14"/></svg></button>
    <button class="step" id="plus" aria-label="Increase delay"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="square"><path d="M1 8h14M8 1v14"/></svg></button>
  </div>
  <div class="spacer"></div>
  <div class="toast" id="toast" aria-live="polite"></div>
  <div class="footer"><button class="save" id="save">SAVE</button></div>
</main>

<script>
(function () {
  var GAP = 10;       // px per millisecond
  var MAX = 75;       // ms
  var REF_MS = 40;    // simulated Auracast latency (assumption, for the demo only)
  var BEAT = 0.5;     // seconds between clicks

  var value = 0;
  var playing = false;

  var el = {
    value: document.getElementById('value'),
    ruler: document.getElementById('ruler'),
    minus: document.getElementById('minus'),
    plus: document.getElementById('plus'),
    play: document.getElementById('play'),
    save: document.getElementById('save'),
    toast: document.getElementById('toast')
  };

  function clamp(v) { return Math.max(0, Math.min(MAX, v)); }
  function centre() { return Math.round(el.ruler.clientWidth / 2); }

  function render() {
    var c = centre();
    var w = el.ruler.clientWidth;
    var html = '';
    for (var n = 0; n <= MAX; n++) {
      var x = c + (n - value) * GAP;
      if (x < -2 || x > w + 2) continue;
      var on = n <= value;
      var h = n % 15 === 0 ? 26 : (n % 5 === 0 ? 22 : 15);
      var col = on ? '#ffffff' : (n % 5 === 0 ? '#d0d0d0' : '#a8a8a8');
      if (n !== value) html += '<div class="tick" style="left:' + (x - 1) + 'px;top:' + (30 - h) + 'px;height:' + h + 'px;background:' + col + '"></div>';
      if (n % 15 === 0) html += '<div class="label" style="left:' + (x - 12) + 'px;color:' + (on ? '#ffffff' : '#9a9a9a') + '">' + n + '</div>';
    }
    html += '<div class="marker" style="left:' + (c - 1) + 'px"></div>';
    el.ruler.innerHTML = html;
    el.value.textContent = value;
    el.ruler.setAttribute('aria-valuenow', value);
    el.ruler.setAttribute('aria-valuetext', value + ' milliseconds');
    el.minus.setAttribute('aria-disabled', value === 0 ? 'true' : 'false');
    el.minus.setAttribute('aria-label', value === 0 ? 'Decrease delay, minimum reached' : 'Decrease delay');
    el.plus.setAttribute('aria-disabled', value === MAX ? 'true' : 'false');
    el.plus.setAttribute('aria-label', value === MAX ? 'Increase delay, maximum reached' : 'Increase delay');
  }

  function setValue(v) {
    v = clamp(v);
    if (v !== value) { value = v; render(); }
  }

  // Ruler drag: the scale slides under the fixed centre marker
  var drag = null;
  el.ruler.addEventListener('pointerdown', function (e) {
    el.ruler.setPointerCapture(e.pointerId);
    drag = { x: e.clientX, v: value };
    el.ruler.classList.add('dragging');
  });
  el.ruler.addEventListener('pointermove', function (e) {
    if (!drag) return;
    setValue(drag.v - Math.round((e.clientX - drag.x) / GAP));
  });
  function endDrag() { drag = null; el.ruler.classList.remove('dragging'); }
  el.ruler.addEventListener('pointerup', endDrag);
  el.ruler.addEventListener('pointercancel', endDrag);

  el.ruler.addEventListener('keydown', function (e) {
    var map = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1, PageUp: 5, PageDown: -5 };
    if (e.key in map) setValue(value + map[e.key]);
    else if (e.key === 'Home') setValue(0);
    else if (e.key === 'End') setValue(MAX);
    else return;
    e.preventDefault();
  });

  // Steppers: tap for 1 ms, hold to repeat
  var holdT, holdI;
  function holdEnd() { clearTimeout(holdT); clearInterval(holdI); }
  function bindStepper(btn, d) {
    btn.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      e.preventDefault();
      holdEnd();
      setValue(value + d);
      holdT = setTimeout(function () { holdI = setInterval(function () { setValue(value + d); }, 70); }, 400);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (t) { btn.addEventListener(t, holdEnd); });
    btn.addEventListener('click', function (e) { if (e.detail === 0) setValue(value + d); }); // keyboard
  }
  bindStepper(el.minus, -1);
  bindStepper(el.plus, 1);

  // Looping click track: left = RCA (follows the delay), right = simulated Auracast (fixed)
  var ctx, timer, nextBeat, beat;
  function click(t, pan, accent) {
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.frequency.value = accent ? 1500 : 1000;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.4, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.035);
    o.connect(g);
    if (ctx.createStereoPanner) {
      var p = ctx.createStereoPanner();
      p.pan.value = pan;
      g.connect(p); p.connect(ctx.destination);
    } else {
      g.connect(ctx.destination);
    }
    o.start(t); o.stop(t + 0.05);
  }
  function schedule() {
    while (nextBeat < ctx.currentTime + 0.12) {
      var accent = beat % 4 === 0;
      click(nextBeat + REF_MS / 1000, 1, accent);
      click(nextBeat + value / 1000, -1, accent);
      nextBeat += BEAT; beat++;
    }
  }
  function startAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      if (!ctx) ctx = new AC();
      if (ctx.resume) ctx.resume();
      nextBeat = ctx.currentTime + 0.1; beat = 0;
      clearInterval(timer);
      timer = setInterval(schedule, 25);
    }
    playing = true;
    el.play.textContent = 'STOP SAMPLE';
    el.play.setAttribute('aria-pressed', 'true');
  }
  function stopAudio() {
    clearInterval(timer);
    playing = false;
    el.play.textContent = 'PLAY SAMPLE';
    el.play.setAttribute('aria-pressed', 'false');
  }
  el.play.addEventListener('click', function () { if (playing) stopAudio(); else startAudio(); });

  // Save: confirmation only
  var toastT;
  el.save.addEventListener('click', function () {
    clearTimeout(toastT);
    el.toast.textContent = 'SAVED · ' + value + ' MS';
    toastT = setTimeout(function () { el.toast.textContent = ''; }, 2200);
  });

  window.addEventListener('resize', render);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
  render();
})();
</script>
</body>
</html>
