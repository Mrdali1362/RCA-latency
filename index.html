<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCA Latency Prototype</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a1a;
    font-family: "Helvetica Neue", "Arial Narrow", Arial, sans-serif;
  }
  .screen {
    position: relative;
    width: 390px;
    height: 844px;
    overflow: hidden;
    background: linear-gradient(to bottom, #55575a 0%, #3a3b3d 35%, #222325 75%, #1d1e1f 100%);
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Header */
  .back {
    position: absolute;
    left: 20px;
    top: 58px;
    width: 20px;
    height: 20px;
    background: none;
    border: none;
    cursor: pointer;
  }
  .back svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2; fill: none; }
  .title {
    position: absolute;
    top: 60px;
    left: 0;
    width: 390px;
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }

  /* Text blocks */
  .heading {
    position: absolute;
    left: 16px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  .body {
    position: absolute;
    left: 16px;
    width: 358px;
    font-size: 15px;
    line-height: 22px;
    color: #f2f2f2;
  }
  #adjustHeading { top: 116px; }
  #adjustBody    { top: 142px; }
  #metroHeading  { top: 412px; }
  #metroBody     { top: 438px; }

  /* Ruler */
  .ruler {
    position: absolute;
    top: 232px;
    left: 0;
    width: 390px;
    height: 32px;
    cursor: grab;
    touch-action: none;
    overflow: hidden;
  }
  .ruler:active { cursor: grabbing; }
  .track {
    position: absolute;
    top: 0;
    left: 0;
    height: 32px;
    width: 608px; /* 76 ms * 8px */
    will-change: transform;
  }
  .tick {
    position: absolute;
    bottom: 0;
    width: 2px;
    height: 16px;
    background: #848486;
  }
  .tick.major {
    height: 24px;
  }
  .tick {
    transition: background-color 0.6s ease, height 0.6s ease;
  }
  .tick.focus {
    height: 32px;
    background: #fff;
    transition: none; /* the new focus tick snaps to white; the previous one fades out */
  }
  .marker {
    position: absolute;
    left: 194px;
    top: 0;
    width: 2px;
    height: 32px;
    background: #fff;
    pointer-events: none;
  }

  /* Readout */
  .readout {
    position: absolute;
    top: 282px;
    left: 0;
    width: 390px;
    text-align: center;
  }
  #value {
    font-size: 48px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .unit {
    margin-top: 10px;
    font-size: 15px;
    color: #f2f2f2;
  }

  /* Play button */
  .play {
    position: absolute;
    left: 167px;
    top: 504px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #1b1b1c;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .play svg { width: 18px; height: 20px; fill: #fff; }
  .pulse {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2px solid #fff;
    opacity: 0;
    pointer-events: none;
  }
  .pulse.beat { animation: beat 500ms ease-out; }
  @keyframes beat {
    0%   { transform: scale(0.95); opacity: 0.9; }
    100% { transform: scale(1.25); opacity: 0; }
  }
  .play-label {
    position: absolute;
    top: 576px;
    left: 0;
    width: 390px;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>
<div class="screen">

  <button class="back" aria-label="Back">
    <svg viewBox="0 0 20 20"><path d="M13 3 L6 10 L13 17"/></svg>
  </button>
  <div class="title">RCA LATENCY</div>

  <div class="heading" id="adjustHeading">ADJUST AUDIO DELAY</div>
  <div class="body" id="adjustBody">Change the audio delay on the RCA out port to sync with the broadcast audio.</div>

  <div class="ruler" id="ruler">
    <div class="track" id="track"></div>
  </div>

  <div class="readout">
    <div id="value">0</div>
    <div class="unit">milliseconds</div>
  </div>

  <div class="heading" id="metroHeading">METRONOME</div>
  <div class="body" id="metroBody">You can use metronome to adjust the delay to compensate for latency on your &lt;Device name&gt;.</div>

  <button class="play" id="playBtn" aria-label="Play">
    <span class="pulse" id="pulse"></span>
    <svg id="iconPlay" viewBox="0 0 18 20"><path d="M2 1 L17 10 L2 19 Z"/></svg>
    <svg id="iconPause" viewBox="0 0 18 20" style="display:none"><rect x="2" y="1" width="4.5" height="18"/><rect x="11.5" y="1" width="4.5" height="18"/></svg>
  </button>
  <div class="play-label" id="playLabel">PLAY</div>

</div>

<script>
  const MIN = 0, MAX = 76, SPACING = 8, CENTER = 195, BPM = 120;

  const track = document.getElementById('track');
  const ruler = document.getElementById('ruler');
  const valueEl = document.getElementById('value');

  let value = 0;
  const ticks = [];

  // One tick per millisecond; every 5th is major
  for (let i = MIN; i <= MAX; i++) {
    const t = document.createElement('div');
    t.className = 'tick' + (i % 5 === 0 ? ' major' : '');
    t.style.left = (i * SPACING) + 'px';
    track.appendChild(t);
    ticks.push(t);
  }

  function render() {
    // Ticks slide left as the value rises; the tick under the centre becomes the white focus tick
    track.style.transform = `translateX(${CENTER - value * SPACING}px)`;
    ticks.forEach((t, i) => t.classList.toggle('focus', i === value));
    valueEl.textContent = value;
  }

  // Drag
  let dragging = false, startX = 0, startValue = 0;

  ruler.addEventListener('pointerdown', (e) => {
    dragging = true;
    startX = e.clientX;
    startValue = value;
    ruler.setPointerCapture(e.pointerId);
  });

  ruler.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const delta = (e.clientX - startX) / SPACING;
    // Dragging left moves the ticks left, which increases the value
    value = Math.round(Math.min(MAX, Math.max(MIN, startValue - delta)));
    render();
  });

  const endDrag = () => { dragging = false; };
  ruler.addEventListener('pointerup', endDrag);
  ruler.addEventListener('pointercancel', endDrag);

  // Metronome (visual only, independent of the delay value)
  const playBtn = document.getElementById('playBtn');
  const pulse = document.getElementById('pulse');
  const iconPlay = document.getElementById('iconPlay');
  const iconPause = document.getElementById('iconPause');
  const playLabel = document.getElementById('playLabel');
  let playing = false, timer = null;

  function beat() {
    pulse.classList.remove('beat');
    void pulse.offsetWidth; // restart animation
    pulse.classList.add('beat');
  }

  playBtn.addEventListener('click', () => {
    playing = !playing;
    if (playing) {
      beat();
      timer = setInterval(beat, 60000 / BPM);
    } else {
      clearInterval(timer);
      timer = null;
    }
    iconPlay.style.display = playing ? 'none' : 'block';
    iconPause.style.display = playing ? 'block' : 'none';
    playLabel.textContent = playing ? 'PAUSE' : 'PLAY';
    playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  });

  render();
</script>
</body>
</html>
